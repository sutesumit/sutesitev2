name: Notify New Bloq

on:
  push:
    branches: [main]
    paths:
      - 'src/content/bloqs/**/index.mdx'

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect and notify new bloqs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BROADCAST_URL: https://www.sumitsute.com/api/telegram/broadcast
        run: |
          set -euo pipefail

          send_notification() {
            local bloq="$1"
            local reason="$2"

            echo "Processing ($reason): $bloq"

            TITLE=$(grep '^title:' "$bloq" | head -1 | sed 's/title: *["'"'"']\?//' | sed 's/["'"'"']$//')
            SLUG=$(grep '^slug:' "$bloq" | head -1 | sed 's/slug: *["'"'"']\?//' | sed 's/["'"'"']$//')
            TAGS=$(sed -n '/^tags:/,/^[a-z]/p' "$bloq" | grep '  - ' | sed 's/  - //' | tr '\n' ',' | sed 's/,$//')

            if [ -z "$SLUG" ]; then
              DIR_NAME=$(basename "$(dirname "$bloq")")
              SLUG=${DIR_NAME#[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-}
            fi
            SLUG=$(printf '%s' "$SLUG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')

            echo "Title: $TITLE"
            echo "Slug: $SLUG"
            echo "Tags: $TAGS"

            OG_URL="https://www.sumitsute.com/og/bloq/$SLUG"
            echo "Waiting for deployment to serve: $OG_URL"
            DEPLOY_READY=false
            DEADLINE=$((SECONDS + 900))
            while [ "$SECONDS" -lt "$DEADLINE" ]; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$OG_URL" || echo 000)
              if [ "$status" = "200" ]; then
                DEPLOY_READY=true
                break
              fi
              echo "  HTTP $status, retrying in 15s (${SECONDS}s of 900s budget elapsed)"
              sleep 15
            done

            if [ "$DEPLOY_READY" = "false" ]; then
              echo "::warning::Deployment did not serve $OG_URL within 15 minutes; broadcasting anyway"
            fi

            curl -X POST "$BROADCAST_URL" \
              -H "Content-Type: application/json" \
              -H "X-Broadcast-Secret: $TELEGRAM_BOT_TOKEN" \
              -d "{\"type\": \"bloq\", \"title\": \"$TITLE\", \"slug\": \"$SLUG\", \"tags\": \"$TAGS\"}" \
              --fail --silent --show-error

            echo "Notification sent for: $TITLE"
          }

          # Process newly added files
          NEW_BLOQS=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'src/content/bloqs/**/index.mdx')

          for bloq in $NEW_BLOQS; do
            DRAFT=$(grep '^draft:' "$bloq" | head -1 | sed 's/draft: *//')
            if [ "$DRAFT" = "true" ]; then
              echo "Skipping draft: $bloq"
              continue
            fi
            send_notification "$bloq" "new"
          done

          # Process modified files where draft changed from true to false
          MODIFIED_BLOQS=$(git diff --name-only --diff-filter=M HEAD^ HEAD -- 'src/content/bloqs/**/index.mdx')

          for bloq in $MODIFIED_BLOQS; do
            if git diff HEAD^ HEAD -- "$bloq" | grep -q '^-draft: *true' && \
               git diff HEAD^ HEAD -- "$bloq" | grep -q '^+draft: *false'; then
              send_notification "$bloq" "published"
            fi
          done

          if [ -z "$NEW_BLOQS" ] && [ -z "$MODIFIED_BLOQS" ]; then
            echo "No bloqs to notify"
          fi